name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Cancel superseded runs on the same ref so a stack of pushes doesn't queue redundant CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege token: CI only reads the code and uploads an artifact.
permissions:
  contents: read

jobs:
  # The `check` job is the required status check for `dev` and `main` branch protection.
  # Renaming this job (or the workflow `name` above) will break required status checks.
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      # Action pins are kept fresh by Dependabot (see .github/dependabot.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Don't leave the token in .git/config for later steps.
          persist-credentials: false

      # pnpm before setup-node, so setup-node's pnpm cache resolver can find the binary.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile fails the build on lockfile drift rather than silently resolving a
      # different dependency tree than the one that was reviewed.
      - name: Guard against non-pnpm lockfiles
        run: test ! -f package-lock.json && test ! -f yarn.lock

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error

      # Last: the slowest step, and the one the earlier checks usually predict.
      - name: Build
        env:
          NEXT_PUBLIC_OCTO_API_URL: https://example.invalid
        run: pnpm build
