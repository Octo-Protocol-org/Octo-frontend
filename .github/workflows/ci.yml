name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The `check` job is the required status check for `dev` and `main` branch protection.
  # Renaming this job (or the workflow `name` above) will break required status checks.
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pnpm before setup-node, so setup-node's pnpm cache resolver can find the binary.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile fails the build on lockfile drift rather than silently resolving a
      # different dependency tree than the one that was reviewed.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload SDK coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sdk-coverage
          path: coverage/
          if-no-files-found: error

      # Last: the slowest step, and the one the earlier checks usually predict.
      - name: Build
        env:
          NEXT_PUBLIC_OCTO_API_URL: https://example.invalid
        run: pnpm build
