name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # pnpm before setup-node, so setup-node's pnpm cache resolver can find the binary.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm

      # --frozen-lockfile fails the build on lockfile drift rather than silently resolving a
      # different dependency tree than the one that was reviewed.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Last: the slowest step, and the one the earlier checks usually predict.
      - name: Build
        env:
          NEXT_PUBLIC_OCTO_API_URL: https://example.invalid
        run: pnpm build
